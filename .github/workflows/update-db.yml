# ============================================================
# WheelSaver DB Update — Actualización Semanal de la BD
# Corre cada domingo y manualmente para refrescar la base
# de datos local con datos frescos de fuentes externas.
# ============================================================
name: DB Update

on:
  schedule:
    # Cada domingo a las 02:00 UTC
    - cron: "0 2 * * 0"
  workflow_dispatch: # Permite ejecución manual

jobs:
  update:
    name: 🔄 Actualizar Base de Datos
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 🔄 GitHub GraphQL Scrape (si hay token de escritura)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN_WRITE || secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          echo "🔄 Scrapeando datos frescos desde GitHub GraphQL..."
          python cli.py scrape --min-stars 500
        timeout-minutes: 30

      - name: 📥 Import from EvanLi/Github-Ranking
        run: |
          echo "📥 Importando datos desde EvanLi..."
          python cli.py import evanli
        timeout-minutes: 10

      - name: 📥 Scrape gitstar-ranking.com
        run: |
          echo "📥 Scrapeando gitstar-ranking.com..."
          python cli.py import gitstar --pages 10
        timeout-minutes: 15

      - name: 📊 Show DB stats after import
        run: |
          echo "📊 Estadísticas de la base de datos:"
          python cli.py stats

      - name: 🧪 Run tests to verify DB integrity
        run: |
          echo "🧪 Verificando integridad con tests..."
          python -m pytest tests/ -v --tb=short -q

      - name: 📈 Upload DB as artifact
        uses: actions/upload-artifact@v4
        with:
          name: top-repos-db
          path: |
            ~/.wheelsaver/top_repos.db
          retention-days: 30
          if-no-files-found: ignore

      - name: 📋 Summary
        run: |
          echo "✅ Actualización completada exitosamente"
          echo "📅 Fecha: $(date -u)"
