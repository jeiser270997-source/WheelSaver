name: Update Top Repos Database

on:
  schedule:
    # Corre todos los domingos a la medianoche (puedes cambiarlo si quieres)
    - cron: '0 0 * * 0'
  workflow_dispatch: # Permite ejecutarlo manualmente desde el botón en la web de GitHub

jobs:
  update-db:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.PAT_GITHUB_TOKEN }}
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Git LFS in Runner
        run: |
          git lfs install

      - name: Run GitHub GraphQL Scraper
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN }}
        run: |
          export PYTHONPATH=E:\PROYECTOS\Mis_Proyectos\WHEELSAVER
          python cli.py scrape --min-stars 500

      - name: Import from EvanLi/Github-Ranking
        run: |
          export PYTHONPATH=E:\PROYECTOS\Mis_Proyectos\WHEELSAVER
          python cli.py import evanli

      - name: Scrape gitstar-ranking.com
        run: |
          export PYTHONPATH=E:\PROYECTOS\Mis_Proyectos\WHEELSAVER
          python cli.py import gitstar

      - name: Commit and Push Changes (LFS Compatible)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/top_repos.db
          # [skip ci] evita que la acción de GitHub vuelva a ejecutarse a sí misma infinitamente
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(db): update top repos database [skip ci]" && git push)
