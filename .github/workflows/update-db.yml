name: Update Top Repos Database

on:
  schedule:
    # Run every Sunday at midnight
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-db:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run GitHub GraphQL Scraper
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN }}
        run: |
          export PYTHONPATH=$(pwd)
          python cli.py scrape --min-stars 500

      - name: Import from EvanLi/Github-Ranking
        run: |
          export PYTHONPATH=$(pwd)
          python cli.py import evanli

      - name: Scrape gitstar-ranking.com
        run: |
          export PYTHONPATH=$(pwd)
          python cli.py import gitstar

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/top_repos.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(db): update top repos database" && git push)
