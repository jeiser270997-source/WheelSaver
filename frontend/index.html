<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WheelSaver | AI Hub</title>
    <!-- Modern Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <header class="header">
        <div class="brand" role="heading" aria-level="1">
            <span aria-hidden="true">🛞</span> WheelSaver
        </div>
        <button class="btn" id="btn-scrape" data-testid="trigger-scrape-btn" aria-label="Actualizar base de datos ejecutando scraper">
            <span id="btn-scrape-text">Actualizar DB (Scrape)</span>
            <span id="btn-scrape-spinner" class="hide" aria-hidden="true">⏳</span>
        </button>
    </header>

    <main>
        <!-- Statistics -->
        <section class="stats-grid">
            <div class="stat-card glass" data-testid="stat-repos-card">
                <div class="stat-title">Total Repos</div>
                <div class="stat-value" id="stat-repos">-</div>
            </div>
            <div class="stat-card glass" data-testid="stat-langs-card">
                <div class="stat-title">Lenguajes</div>
                <div class="stat-value" id="stat-langs">-</div>
            </div>
            <div class="stat-card glass" data-testid="stat-max-card">
                <div class="stat-title">Estrella Máxima</div>
                <div class="stat-value" id="stat-max">-</div>
            </div>
            <div class="stat-card glass" data-testid="stat-avg-card">
                <div class="stat-title">Estrella Promedio</div>
                <div class="stat-value" id="stat-avg">-</div>
            </div>
        </section>

        <!-- Search -->
        <section class="search-section">
            <form id="search-form" class="search-box glass" data-testid="search-form">
                <input type="text" id="input-q" placeholder="¿Qué buscas? ej: fastapi, react, auth" aria-label="Término de búsqueda" data-testid="search-input-q" required>
                <input type="text" id="input-lang" placeholder="Lenguaje (opcional)" aria-label="Filtrar por lenguaje" data-testid="search-input-lang">
                <input type="number" id="input-limit" placeholder="Límite" value="10" min="1" max="100" aria-label="Límite de resultados" style="flex: 0.3; min-width: 80px;" data-testid="search-input-limit">
                <button type="submit" class="btn" data-testid="search-submit-btn">Buscar</button>
            </form>
        </section>

        <!-- Results -->
        <section class="results-section">
            <div class="table-container glass hide" id="results-card" data-testid="results-container">
                <table data-testid="results-table">
                    <thead>
                        <tr>
                            <th>Repositorio</th>
                            <th>Estrellas</th>
                            <th>Lenguaje</th>
                            <th>Descripción</th>
                        </tr>
                    </thead>
                    <tbody id="results-body" data-testid="results-body">
                        <!-- Filled by JS -->
                    </tbody>
                </table>
            </div>

            <!-- Skeleton Loaders -->
            <div class="table-container glass hide" id="loading-skeleton" data-testid="skeleton-loader">
                <table>
                    <thead>
                        <tr>
                            <th>Repositorio</th>
                            <th>Estrellas</th>
                            <th>Lenguaje</th>
                            <th>Descripción</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td><div class="skeleton sk-title"></div></td>
                            <td><div class="skeleton sk-badge"></div></td>
                            <td><div class="skeleton sk-badge"></div></td>
                            <td><div class="skeleton sk-text"></div><div class="skeleton sk-text" style="width: 60%"></div></td>
                        </tr>
                        <tr>
                            <td><div class="skeleton sk-title"></div></td>
                            <td><div class="skeleton sk-badge"></div></td>
                            <td><div class="skeleton sk-badge"></div></td>
                            <td><div class="skeleton sk-text"></div><div class="skeleton sk-text" style="width: 40%"></div></td>
                        </tr>
                        <tr>
                            <td><div class="skeleton sk-title"></div></td>
                            <td><div class="skeleton sk-badge"></div></td>
                            <td><div class="skeleton sk-badge"></div></td>
                            <td><div class="skeleton sk-text"></div><div class="skeleton sk-text" style="width: 70%"></div></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Toast Container -->
    <div id="toast-container" data-testid="toast-container" aria-live="polite"></div>

    <script src="app.js"></script>
</body>
</html>
