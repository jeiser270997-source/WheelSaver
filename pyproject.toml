[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wheelsaver"
version = "3.3.2"
description = "GitHub repo scraper + AI audit tool. Search 23k+ repos offline, audit projects via AI."
readme = "README.md"
license = {text = "MIT"}
keywords = ["github", "scraper", "ai", "audit", "cli"]
requires-python = ">=3.10"
dependencies = [
    "httpx==0.28.1",
    "typer==0.25.1",
    "rich==15.0.0",
    "tqdm==4.67.3",
    "fastapi==0.138.0",
    "uvicorn[standard]==0.49.0",
    "python-dotenv==1.2.2",
    "loguru==0.7.3",
    "openai==2.37.0",
    "aiosqlite==0.22.1",
    "beautifulsoup4==4.14.3",
    "slowapi==0.1.10",
    "tenacity==9.1.4"
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-playwright==0.8.0",
    "black==26.5.1",
    "ruff==0.15.20"
]
audit = [
    "bandit==1.9.4",
    "vulture==2.16",
    "radon==6.0.1"
]

[project.scripts]
wheelsaver = "cli:app"

[project.urls]
Homepage = "https://github.com/JeisarGtz/Top_Repos"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E402", "E741", "F841"]

[tool.setuptools]
packages = ["api", "scraper", "services", "scripts"]
py-modules = ["cli"]
