[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wheelsaver"
version = "3.2.1"
description = "GitHub repo scraper + AI audit tool. Search 23k+ repos offline, audit projects via AI."
readme = "README.md"
license = {text = "MIT"}
keywords = ["github", "scraper", "ai", "audit", "cli"]
requires-python = ">=3.10"
dependencies = [
    "httpx",
    "typer",
    "rich",
    "tqdm",
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv",
    "loguru",
    "openai",
    "aiosqlite",
    "async-lru",
    "beautifulsoup4",
]

[project.optional-dependencies]

dev = ["pytest", "pytest-asyncio", "pytest-cov", "ruff"]

[project.scripts]
wheelsaver = "cli:app"

[project.urls]
Homepage = "https://github.com/JeisarGtz/Top_Repos"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.setuptools]
packages = ["api", "scraper", "services"]
py-modules = ["cli"]
