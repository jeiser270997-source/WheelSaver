[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wheelsaver"
version = "3.2.1"
description = "GitHub repo scraper + AI audit tool. Search 23k+ repos offline, audit projects via AI."
readme = "README.md"
license = {text = "MIT"}
keywords = ["github", "scraper", "ai", "audit", "cli"]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "tqdm>=4.66.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "openai>=1.0.0",
    "aiosqlite>=0.19.0",
    "async-lru>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "slowapi>=0.1.9",
    "tenacity>=8.2.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-playwright",
    "black",
    "ruff"
]

[project.scripts]
wheelsaver = "cli:app"

[project.urls]
Homepage = "https://github.com/JeisarGtz/Top_Repos"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E402", "E741", "F841"]

[tool.setuptools]
packages = ["api", "scraper", "services", "scripts"]
py-modules = ["cli"]
